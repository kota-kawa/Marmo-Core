[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marmo-core"
version = "0.4.0"
description = "Lightweight AI Agent Kernel primitives: resource registry, search CLI, and guarded execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Marmo-Core Contributors" }
]
keywords = ["ai-agent", "kernel", "resource-registry", "retrieval", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
benchmark = ["fastembed>=0.8.0"]
dev = [
  "build>=1.2",
  "check-manifest>=0.51",
  "check-wheel-contents>=0.6",
  "coverage>=7.6",
  "mypy>=1.11",
  "ruff>=0.8",
  "twine>=6.0",
]

[project.scripts]
marmo = "marmo_core.cli:main"
marmo-core = "marmo_core.cli:main"

[tool.setuptools.packages.find]
include = ["marmo_core*"]

[tool.setuptools.package-data]
marmo_core = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["marmo_core"]
pretty = true
