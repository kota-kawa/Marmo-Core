name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python scripts/release_check.py
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'from marmo_core import __version__; print(__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi
      - run: python -W error::ResourceWarning -m unittest discover -s tests
      - run: check-manifest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-cache-dir dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import sys
          from pathlib import Path

          import marmo_core

          installed = Path(marmo_core.__file__).resolve()
          assert installed.is_relative_to(Path(sys.prefix).resolve()), f"imported from outside the venv: {installed}"
          print(marmo_core.__version__)
          PY
          "$RUNNER_TEMP/wheel-smoke/bin/marmo" --version
          "$RUNNER_TEMP/wheel-smoke/bin/marmo-core" --help
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  # A version tag is published only after the full CI workflow (every job that
  # .github/BRANCH_PROTECTION.md lists as required) has passed on the tagged
  # commit. A manual run never reaches PyPI, so it skips this job.
  ci:
    name: Required CI on the tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/marmo-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/marmo-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
