name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.python-version != '3.10'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[dev]'
        if: matrix.python-version != '3.10'
      - run: python -W error::ResourceWarning -m unittest discover -s tests
        if: matrix.python-version != '3.10'
      - name: Test Python 3.10 in Docker
        if: matrix.python-version == '3.10'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            python:3.10-slim@sha256:6ff506466f8b1e981719b468cc0023b8ef000b983cdec0eafe119d01f379e31d \
            sh -c "python -m pip install '.[dev]' && python -W error::ResourceWarning -m unittest discover -s tests"

  release:
    name: Static and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check marmo_core tests scripts tools
      - run: mypy marmo_core
      - run: python scripts/release_check.py
      - run: python scripts/check_doc_paths.py
      - run: python scripts/check_env_documentation.py
      - run: check-manifest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag marmo-core:ci .
      - run: docker run --rm marmo-core:ci python -m unittest discover -s tests
