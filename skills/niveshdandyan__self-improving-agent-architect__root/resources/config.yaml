# Self-Improving Agent Architect Configuration
# =============================================

# Swarm Configuration
# Controls how agent swarms are created and executed
swarm:
  # Maximum number of agents in a swarm
  max_agents: 12

  # Minimum number of agents in a swarm
  min_agents: 3

  # Timeout per agent in seconds
  timeout_per_agent: 600

  # Whether to retry failed agents
  retry_failed: true

  # Maximum retry attempts per agent
  max_retries: 2

  # Default model for agents
  default_model: sonnet

  # Use haiku for simpler tasks
  simple_task_model: haiku

  # Parallel execution settings
  parallel:
    # Maximum concurrent agents
    max_concurrent: 8

    # Stagger launch by this many ms
    launch_stagger: 100

# Evolution Configuration
# Controls the genetic algorithm for prompt improvement
evolution:
  # Enable/disable self-improvement
  enabled: true

  # Population size for genetic algorithm
  population_size: 50

  # Number of generations to run
  generations: 100

  # Probability of mutation
  mutation_rate: 0.1

  # Probability of crossover
  crossover_rate: 0.7

  # Number of top performers to preserve
  elitism_count: 5

  # Selection method: tournament, roulette, rank, truncation, boltzmann
  selection_method: tournament

  # Tournament size (if using tournament selection)
  tournament_size: 3

  # Target fitness score (0-100)
  target_fitness: 95

  # Convergence detection
  convergence:
    # Generations without improvement before triggering diversification
    plateau_threshold: 10

    # Minimum diversity level before diversification
    min_diversity: 0.1

    # Diversification strategies: injection, mutation_boost, partial_reset
    strategies:
      - injection
      - mutation_boost

# Metrics Configuration
# Controls what data is collected during execution
metrics:
  # Log all swarm executions
  log_executions: true

  # Collect detailed timing information
  collect_timing: true

  # Track code quality metrics
  track_quality: true

  # Store execution history
  store_history: true

  # History retention (number of executions to keep)
  history_retention: 1000

  # Metrics to collect
  collect:
    - completion_time
    - agent_time
    - wait_time
    - token_usage
    - files_created
    - lines_of_code
    - syntax_errors
    - type_errors
    - test_results
    - integration_conflicts

# Benchmarks Configuration
# Standard tasks for evaluating prompt fitness
benchmarks:
  # Simple CRUD API
  - id: simple-crud
    name: Simple CRUD API
    description: Build a REST API with CRUD operations
    max_time: 120000
    expected_files:
      - index.js
      - routes.js
      - controllers.js
    weight: 1.0

  # React Component
  - id: react-component
    name: React Component
    description: Build a React component with state
    max_time: 60000
    expected_files:
      - Component.jsx
      - Component.css
    weight: 1.0

  # Data Processing
  - id: data-processing
    name: Data Processing Script
    description: Process and transform data
    max_time: 90000
    expected_files:
      - process.js
    weight: 0.8

  # Multi-file Project
  - id: multi-file-project
    name: Multi-file Project
    description: Build a project with multiple interconnected files
    max_time: 180000
    expected_files:
      - index.js
      - commands/*.js
      - utils.js
      - config.js
    weight: 1.2

  # Code with Tests
  - id: with-tests
    name: Code with Tests
    description: Build code along with unit tests
    max_time: 150000
    expected_files:
      - stringUtils.js
      - stringUtils.test.js
    weight: 1.5

# Version Management Configuration
# Controls how evolved prompts are versioned and deployed
versioning:
  # Minimum improvement required to auto-deploy (as decimal, e.g., 0.05 = 5%)
  auto_deploy_threshold: 0.05

  # Number of versions to keep
  keep_versions: 10

  # Enable rollback capability
  enable_rollback: true

  # Require statistical significance for deployment
  require_significance: true

  # Significance level (alpha) for statistical tests
  significance_level: 0.05

  # Minimum sample size for significance testing
  min_sample_size: 30

# Failure Forensics Configuration
# Controls failure analysis and fix suggestion
forensics:
  # Enable automatic fix suggestions
  suggest_fixes: true

  # Categories to analyze
  categories:
    - prompt_issues
    - dependency_issues
    - execution_issues
    - output_issues
    - integration_issues

  # Known failure patterns (loaded from patterns.json)
  patterns_file: patterns.json

  # Root cause analysis depth
  analysis_depth: 3

# Logging Configuration
# Controls what gets logged and where
logging:
  # Log level: debug, info, warn, error
  level: info

  # Log format: json, text
  format: json

  # Log directory
  directory: ./logs

  # Rotate logs
  rotation:
    enabled: true
    max_size: 10MB
    max_files: 5

# Quality Scoring Weights
# How different quality aspects contribute to the overall score
quality_weights:
  syntax_correctness: 0.25
  type_correctness: 0.25
  test_pass_rate: 0.30
  lint_score: 0.10
  documentation: 0.10

# Efficiency Scoring Weights
efficiency_weights:
  no_redundant_work: 0.40
  low_retry_rate: 0.30
  token_efficiency: 0.30

# Overall Swarm Scoring Weights
swarm_weights:
  speed: 0.30
  quality: 0.50
  efficiency: 0.20

# Agent Role Templates
# Default configurations for each agent role
agent_templates:
  core_architect:
    priority: 1
    wave: 1
    responsibilities:
      - Project structure
      - Configuration files
      - Shared types and interfaces
      - Base utilities

  backend_engineer:
    priority: 2
    wave: 2
    responsibilities:
      - API routes
      - Controllers
      - Database models
      - Business logic

  frontend_engineer:
    priority: 2
    wave: 2
    responsibilities:
      - UI components
      - State management
      - Styling
      - User interactions

  integration_engineer:
    priority: 2
    wave: 2
    responsibilities:
      - Third-party API integration
      - OAuth flows
      - Webhooks
      - External service adapters

  security_engineer:
    priority: 3
    wave: 3
    responsibilities:
      - Authentication
      - Authorization
      - Input validation
      - Security headers

  qa_engineer:
    priority: 4
    wave: 4
    responsibilities:
      - Unit tests
      - Integration tests
      - Edge case handling
      - Test utilities

  integration_lead:
    priority: 5
    wave: 5
    responsibilities:
      - Merge all outputs
      - Resolve conflicts
      - Final validation
      - Package delivery
