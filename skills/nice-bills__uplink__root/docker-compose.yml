version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/genesis.db
      - MONAD_RPC_URL=https://testnet-rpc.monad.xyz
      - PLATFORM_API=http://localhost:8000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MOLTBOOK_API_KEY=${MOLTBOOK_API_KEY}
    volumes:
      - backend_data:/app/data
    networks:
      - genesis_network

  frontend:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MONAD_RPC_URL=https://testnet-rpc.monad.xyz
    depends_on:
      - backend
    networks:
      - genesis_network

  event_listener:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python src/events/listener.py
    environment:
      - PLATFORM_API=http://backend:8000
      - MONAD_RPC_URL=https://testnet-rpc.monad.xyz
    depends_on:
      - backend
    networks:
      - genesis_network
    restart: unless-stopped

  twitter_bot:
    build:
      context: ./agents
      dockerfile: Dockerfile
    environment:
      - PLATFORM_API=http://backend:8000
      - TWITTER_USERNAME=${TWITTER_USERNAME}
      - TWITTER_PASSWORD=${TWITTER_PASSWORD}
    volumes:
      - twitter_cookies:/app/cookies
    depends_on:
      - backend
    networks:
      - genesis_network
    restart: unless-stopped

volumes:
  backend_data:
  twitter_cookies:

networks:
  genesis_network:
    driver: bridge
