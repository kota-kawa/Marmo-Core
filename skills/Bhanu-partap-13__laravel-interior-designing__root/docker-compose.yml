services:
  app:
    env_file: .env
    build: .
    ports:
      - "10000:10000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: interior_db
      DB_USERNAME: root
      DB_PASSWORD: bhanu123
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_PUBLIC_HOST: localhost
      REVERB_PUBLIC_PORT: 8082
      REVERB_PUBLIC_SCHEME: http
    depends_on:
      - db
    volumes:
      - ./storage:/var/www/html/storage

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bhanu123
      MYSQL_DATABASE: interior_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  reverb:
    build: .
    env_file: .env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  db_data: