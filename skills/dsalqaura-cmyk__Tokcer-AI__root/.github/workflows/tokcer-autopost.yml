name: Tokcer AI — Auto Video Generator

on:
  schedule:
    # Jalan setiap jam 05:00, 10:00, 12:00 UTC = 12:00, 17:00, 19:00 WIB
    - cron: '0 5 * * *'   # 12:00 WIB
    - cron: '0 10 * * *'  # 17:00 WIB
    - cron: '0 12 * * *'  # 19:00 WIB
    # Juga jalan setiap 6 jam untuk auto-replenish jika pending < 5
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode bot (auto/fill/status)'
        required: false
        default: 'auto'

jobs:
  run-bot:
    name: 🎬 Generate & Upload Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🚚 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install requests moviepy pillow edge-tts numpy

      - name: 🎬 Run bot
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TOKCER_HEADLESS: "true"
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          echo "Running bot in mode: $MODE"
          python tiktok_engine/tokcer_viral_bot.py --mode $MODE

      - name: 📋 Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_number }}
          path: tiktok_engine/autopost_bot.log
          retention-days: 7
