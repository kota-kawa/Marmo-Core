name: Deploy Tokcer AI

on:
  push:
    branches:
      - main
      - staging

jobs:
  # ── Job 1: DB Migrations via service role REST ───────────────────────────────
  db-migrate:
    name: 🗄️ DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🗄️ Apply migrations (production)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://iogxyohoexfkpugdtymu.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for file in supabase/migrations/*.sql; do
            echo "▶ Applying: $file"
            SQL=$(cat "$file" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/run_migration" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"sql\": ${SQL}}")
            echo "  HTTP $STATUS: $(cat /tmp/resp.txt | head -c 200)"
          done

      - name: 🗄️ Apply migrations (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for file in supabase/migrations/*.sql; do
            echo "▶ Applying: $file"
            SQL=$(cat "$file" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/rest/v1/rpc/run_migration" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"sql\": ${SQL}}")
            echo "  HTTP $STATUS: $(cat /tmp/resp.txt | head -c 200)"
          done

  # ── Job 2: Frontend Deploy ───────────────────────────────────────────────────
  web-deploy:
    name: 🚀 Deploy Frontend
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Install dependencies
        run: rm -rf package-lock.json node_modules && npm install

      - name: 🏗️ Build Project
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            npm run build
          else
            npx vite build --mode staging
          fi
        env:
          VITE_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.VITE_SUPABASE_URL || secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && secrets.VITE_SUPABASE_ANON_KEY || secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          # DEEPSEEK_API_KEY tidak di-inject ke build — key hanya ada di Supabase Edge Function secrets

      - name: 📂 Sync to Staging
        if: github.ref == 'refs/heads/staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: staging.tokcer-ai.com/

      - name: 📂 Sync to Production
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
